{% extends 'base.html' %}
{% load static %}
{% block title %}Contact — Smart File Toolkit{% endblock %}
{% block content %}
<section class="simple-page">
  <div class="simple-page-inner" style="max-width: 640px">
    <div class="section-header">
      <p class="section-eyebrow">Get in Touch</p>
      <h1 class="section-title">Contact Us</h1>
      <p class="section-desc">Have a question or suggestion? We'd love to hear from you.</p>
    </div>
    <div class="contact-card">
      <form class="contact-form" onsubmit="handleContactForm(event)">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="john@example.com" required />
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject">
            <option value="general">General Inquiry</option>
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
            <option value="other">Other</option>
            <option value="UI">UI Optimization</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full">
          <i data-feather="send"></i> Send Message
        </button>
        <div style=" text-align: center;">
          <p class="contact-note">We aim to respond within 24-48 hours. Thank you for reaching out!</p>
        </div>
      </form>
    </div>
  </div>
</section>
<script>
async function handleContactForm(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i data-feather="loader"></i> Sending...';

  const formData = new FormData();
  formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
  formData.append('name',    document.getElementById('name').value);
  formData.append('email',   document.getElementById('email').value);
  formData.append('subject', document.getElementById('subject').value);
  formData.append('message', document.getElementById('message').value);

  try {
    const res  = await fetch("{% url 'contact_submit' %}", { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
      showToast('Message sent! We will get back to you soon.', 'success');
      e.target.reset();
    } else {
      showToast(data.error || 'Failed to send message.', 'error');
    }
  } catch {
    showToast('Network error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-feather="send"></i> Send Message';
    feather.replace({ "stroke-width": 1.8 });
  }
}
</script>
{% endblock %}
